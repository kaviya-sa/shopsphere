<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Products</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header id="siteHeader"></header>

    <main class="section">
        <div class="page-header">
            <span class="eyebrow">OUR STORE</span>
            <h1>Explore Products</h1>
            <p>Find the perfect products for you.</p>
        </div>

        <div class="filters">
            <input id="searchInput" type="search" placeholder="Search products..." aria-label="Search products">

            <select id="categoryFilter" aria-label="Filter by category">
                <option value="all">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home">Home</option>
                <option value="Accessories">Accessories</option>
            </select>

            <select id="sortFilter" aria-label="Sort products">
                <option value="default">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="rating">Top Rated</option>
                <option value="name">Name A-Z</option>
            </select>
        </div>

        <div id="productCount" class="product-count"></div>

        <div id="productGrid" class="product-grid"></div>
    </main>

    <footer id="siteFooter"></footer>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
