<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Admin</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header id="siteHeader"></header>

    <main class="section">
        <div class="page-header">
            <span class="eyebrow">ADMIN PANEL</span>
            <h1>Product Management</h1>
            <p>Create, update and delete products.</p>
        </div>

        <section class="admin-layout">
            <div class="panel">
                <h2 id="formTitle">Add Product</h2>

                <form id="productForm">
                    <input type="hidden" id="productId">

                    <label for="productName">Product Name</label>
                    <input id="productName" required>

                    <label for="productCategory">Category</label>
                    <select id="productCategory" required>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Home">Home</option>
                        <option value="Accessories">Accessories</option>
                    </select>

                    <label for="productPrice">Price</label>
                    <input id="productPrice" type="number" min="1" required>

                    <label for="productRating">Rating</label>
                    <input id="productRating" type="number" min="1" max="5" step="0.1" value="4.5">

                    <label for="productImage">Image URL</label>
                    <input id="productImage" type="url" required>

                    <label for="productDescription">Description</label>
                    <textarea id="productDescription" rows="4" required></textarea>

                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">Save Product</button>
                        <button class="btn btn-secondary" type="button" id="cancelEdit">Clear</button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <div class="panel-heading">
                    <h2>Products</h2>
                    <span id="adminProductCount"></span>
                </div>

                <div id="adminProducts"></div>
            </div>
        </section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/products.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
