<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Login</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

    <main class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo auth-logo">Shop<span>Sphere</span></a>

            <h1>Welcome back</h1>
            <p>Login to continue shopping.</p>

            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="email" required placeholder="you@example.com">

                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" required minlength="4" placeholder="••••••••">

                <button class="btn btn-primary btn-full" type="submit">Login</button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

            <div class="demo-box">
                <strong>Demo account</strong>
                <p>Email: demo@shopsphere.com</p>
                <p>Password: 123456</p>
            </div>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
