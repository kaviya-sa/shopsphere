<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Register</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

    <main class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo auth-logo">Shop<span>Sphere</span></a>

            <h1>Create account</h1>
            <p>Join ShopSphere today.</p>

            <form id="registerForm">
                <label for="registerName">Full Name</label>
                <input id="registerName" type="text" required placeholder="Your name">

                <label for="registerEmail">Email</label>
                <input id="registerEmail" type="email" required placeholder="you@example.com">

                <label for="registerPassword">Password</label>
                <input id="registerPassword" type="password" required minlength="4" placeholder="Minimum 4 characters">

                <button class="btn btn-primary btn-full" type="submit">Create Account</button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
